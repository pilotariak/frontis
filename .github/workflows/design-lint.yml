---

name: Design System / Lint

on:
  pull_request:
    paths:
      - "DESIGN.md"
      - "gateway/index.html"
      - "hack/gen-design-tokens.py"
      - ".github/workflows/design-lint.yml"
  push:
    branches:
      - main
    paths:
      - "DESIGN.md"
      - "gateway/index.html"
      - "hack/gen-design-tokens.py"
      - ".github/workflows/design-lint.yml"

# Deny all permissions at workflow level
permissions: {}

jobs:
  lint-design:
    name: Lint & Token Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2

      - name: Lint DESIGN.md against the design.md standard
        run: bunx @google/design.md@0.4.0 lint DESIGN.md

      - name: Verify gateway/index.html tokens are in sync with DESIGN.md
        run: |
          python3 -m pip install --quiet pyyaml
          python3 hack/gen-design-tokens.py --check
