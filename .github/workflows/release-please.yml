---

name: Project / Release

on:
  push:
    branches:
    - main

# Deny all permissions at workflow level
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # to push tags and changelog
      pull-requests: write    # to create/modify the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
      with:
        egress-policy: audit

    - name: Checkout Code
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Run Release Please Action
      uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
      id: release
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target-branch: ${{ github.ref_name }}
        config-file: .github/release-please-config.json

  # Tags created by release-please with GITHUB_TOKEN do not trigger
  # `on: push: tags` workflows, so publish the Hive schemas from here.
  publish-hive:
    name: Publish Hive schemas
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/hive.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
