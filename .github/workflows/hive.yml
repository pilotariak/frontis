---
name: Deploy / Hive

on:
  # Called by release-please once a release has been created.
  # Tags pushed with GITHUB_TOKEN never trigger `on: push: tags`, so the
  # release workflow invokes this one directly instead.
  workflow_call:
    inputs:
      ref:
        description: "Git ref (tag or SHA) whose schemas are published"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag or SHA) whose schemas are published (default: current branch)"
        required: false
        type: string
        default: ""

# Deny all permissions at workflow level
permissions: {}

# One Hive publish at a time; never cancel a running publish.
concurrency:
  group: hive-publish
  cancel-in-progress: false

jobs:
  publish-schemas:
    name: Publish ${{ matrix.subgraph }} schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    strategy:
      matrix:
        subgraph:
          - echo
          - clubs
          - competitions
          - results
          - specialties
          - categories
      fail-fast: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: 🚚 Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: 🎉 Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2

      - name: 📦️ Install dependencies
        run: bun install

      - name: 📡 Publish ${{ matrix.subgraph }} schema to Hive
        env:
          SUBGRAPH: ${{ matrix.subgraph }}
          HIVE_ACCESS_TOKEN: ${{ secrets.HIVE_ACCESS_TOKEN }}
          HIVE_TARGET: ${{ secrets.HIVE_ORG }}/${{ secrets.HIVE_PROJECT }}/${{ secrets.HIVE_ENV }}
          HIVE_URL: ${{ secrets.HIVE_URL }}
          COMMIT: ${{ github.sha }}
        run: |
          bunx @graphql-hive/cli schema:publish \
            --registry.accessToken "${HIVE_ACCESS_TOKEN}" \
            --target "${HIVE_TARGET}" \
            --service "${SUBGRAPH}" \
            --url "http://frontis-${SUBGRAPH}.${HIVE_URL}/graphql" \
            --author "github-actions" \
            --commit "${COMMIT}" \
            "subgraphs/${SUBGRAPH}/schema.graphql"

  verify-supergraph:
    name: Verify Supergraph on Hive CDN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    needs: publish-schemas
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: 🔍 Fetch composed supergraph from Hive CDN
        env:
          HIVE_CDN_ACCESS_TOKEN: ${{ secrets.HIVE_CDN_ACCESS_TOKEN }}
          HIVE_CDN_ENDPOINT: ${{ secrets.HIVE_CDN_ENDPOINT }}
        run: |
          curl --fail --silent --show-error \
            -H "X-Hive-CDN-Key: ${HIVE_CDN_ACCESS_TOKEN}" \
            "${HIVE_CDN_ENDPOINT}/supergraph" > /dev/null
