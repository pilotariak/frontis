extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.5"
    import: ["@key"]
  )

"""
A player of a match lineup, as the league site prints it.
"""
type LineupPlayer {
  "Player name as printed by the league site, marker included (\"PRADERE Bastien (S)\")."
  name: String!
  "Licence number, optionally followed by the licence club (\"097866 - 01-641-015\")."
  number: String
  "The player, for their statistics. Null when the lineup gives no licence."
  player: Player
}

"""
The two players representing a club in a match.
"""
type ClubLineup {
  "First player."
  player1: LineupPlayer
  "Second player (doubles)."
  player2: LineupPlayer
}

"""
A player, identified by licence number. Statistics are computed from the match
results of the league selected by `X-Pilotariak-League`; the rankings subgraph
adds the player's rankings.
"""
type Player @key(fields: "licence") {
  "Licence number, leading zeros kept (e.g. \"059063\")."
  licence: String!
  """
  Name as printed in the player's results, marker stripped. Falls back to the
  latest ranking for a player without results.
  """
  name: String
  """
  Match statistics, optionally restricted to a competition, a specialty and a
  category.
  """
  stats(competitionId: ID, specialtyId: ID, categoryId: ID): PlayerStats!
  "Players met on the same side, most matches first."
  partners(competitionId: ID, specialtyId: ID, categoryId: ID): [PlayerMatchup!]!
  "Players met on the other side, most matches first."
  opponents(competitionId: ID, specialtyId: ID, categoryId: ID): [PlayerMatchup!]!
  "The player's matches, most recent first. `limit` is clamped to 1..500."
  results(
    competitionId: ID
    specialtyId: ID
    categoryId: ID
    limit: Int = 100
    offset: Int = 0
  ): [Result!]!
}

"""
Match statistics of a player. A match with no score, or with as many sets won
by each side, counts as played but neither won nor lost.
"""
type PlayerStats {
  "Matches played."
  played: Int!
  "Matches won."
  won: Int!
  "Matches lost."
  lost: Int!
  "Sets won, over every match."
  setsWon: Int!
  "Sets lost, over every match."
  setsLost: Int!
  "Points scored by the player's side, over every set."
  pointsFor: Int!
  "Points scored by the other side, over every set."
  pointsAgainst: Int!
  """
  The same statistics for each competition, specialty and category the player
  has matches in, most recent season first.
  """
  breakdown: [PlayerStatsLine!]!
}

"""
Match statistics of a player in one competition, specialty and category.
"""
type PlayerStatsLine {
  competition: Competition!
  specialty: Specialty!
  category: Category
  played: Int!
  won: Int!
  lost: Int!
  setsWon: Int!
  setsLost: Int!
  pointsFor: Int!
  pointsAgainst: Int!
}

"""
Another player and the matches shared with them, as partner or as opponent.
`won` and `lost` are those of the player queried.
"""
type PlayerMatchup {
  player: Player!
  "Matches played with (partners) or against (opponents) this player."
  played: Int!
  won: Int!
  lost: Int!
}

"""
The score of a single set, as parsed from the raw `scores` string.
"""
type SetScore {
  "Points scored by club A in this set."
  a: Int!
  "Points scored by club B in this set."
  b: Int!
}

"""
A single match result between two clubs.
"""
type Result @key(fields: "id") {
  id: ID!
  "Competition this result belongs to."
  competition: Competition!
  "Pelota discipline played."
  specialty: Specialty!
  "Age/skill category."
  category: Category
  "Date of the match as stored by the source league system (DD/MM/YYYY)."
  dateMatch: String
  "Home club."
  clubA: Club!
  "Away club."
  clubB: Club!
  "Match scores as a space-separated list of sets (e.g. \"15/10 15/13\")."
  scores: String
  """
  Per-set scores parsed from `scores`. Empty when `scores` is null or
  contains no well-formed `a/b` pair.
  """
  sets: [SetScore!]!
  """
  Club that won the most sets. Null when there is no score, when the set
  count is tied, or when the match has not been played.
  """
  winner: Club
  "Tournament phase (e.g. Finale, 1/2 Finale, Poule)."
  phase: String
  "Players lineup for club A."
  clubALineup: ClubLineup
  "Players lineup for club B."
  clubBLineup: ClubLineup
}

# --- Entity stubs + reverse edges ---
#
# The entities below are owned by other subgraphs. This subgraph contributes
# a `results` field to each of them so clients can navigate from a club,
# specialty or category straight to its matches.

"Reference to a Competition entity owned by the competitions subgraph."
type Competition @key(fields: "id") {
  id: ID!
}

"Reference to a Club entity owned by the clubs subgraph."
type Club @key(fields: "id") {
  id: ID!
  "Results where this club played as club A or club B, oldest first."
  results(limit: Int = 100, offset: Int = 0): [Result!]!
}

"Reference to a Specialty entity owned by the specialties subgraph."
type Specialty @key(fields: "id") {
  id: ID!
  "Results played in this discipline, oldest first."
  results(limit: Int = 100, offset: Int = 0): [Result!]!
}

"Reference to a Category entity owned by the categories subgraph."
type Category @key(fields: "id") {
  id: ID!
  "Results played in this category, oldest first."
  results(limit: Int = 100, offset: Int = 0): [Result!]!
}

# --- Queries ---

type Query {
  "Fetch a single result by its ID."
  result(id: ID!): Result
  """
  List results with optional filters, ordered by id (insertion order).
  `limit` is clamped to 1..500.
  """
  results(
    competitionId: ID
    specialtyId: ID
    categoryId: ID
    clubId: ID
    phase: String
    limit: Int = 100
    offset: Int = 0
  ): [Result!]!
  """
  A player by licence (exact match). Null when the licence appears in no result
  and no ranking of the league.
  """
  player(licence: String!): Player
  """
  Players whose name matches, in name order. A name matches regardless of case,
  accents and word order, and every word given must appear in the player's
  name: "ane etxeberri" and "Etxeberri" both find "ETXEBERRI Ane". Words
  shorter than two characters are ignored. Only players with results are
  found. `limit` is clamped to 1..500.
  """
  players(name: String!, limit: Int = 100, offset: Int = 0): [Player!]!
}
