extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.5"
    import: ["@key"]
  )

"""
A competition category (e.g. Seniors, Juniors, Vétérans).
"""
type Category @key(fields: "id") {
  id: ID!
  "Human-readable name of the category."
  name: String!
  "Whether this category is enabled (opt-in; defaults to false)."
  enabled: Boolean!
}

type Query {
  "Fetch a single category by its ID."
  category(id: ID!): Category
  """
  List categories. Pass `enabled: true` to get only categories that are
  opted in; omit the argument to get all of them.
  """
  categories(enabled: Boolean): [Category!]!
}
