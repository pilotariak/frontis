extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.5"
    import: ["@key"]
  )

"""
A pelota club (e.g. Denek Bat, Noizbait, Bixintxo).
"""
type Club @key(fields: "id") {
  id: ID!
  "Official club name."
  name: String!
}

type Query {
  "Fetch a single club by its ID."
  club(id: ID!): Club
  "List all clubs."
  clubs: [Club!]!
}
