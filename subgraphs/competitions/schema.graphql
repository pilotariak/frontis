extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.5"
    import: ["@key"]
  )

"""
A competition (e.g. Championnat LCAPB 2025-2026).
"""
type Competition @key(fields: "id") {
  id: ID!
  "External identifier used by the source league system."
  source_id: String
  "Competition name."
  name: String!
  "Whether this competition is enabled (opt-in; defaults to false)."
  enabled: Boolean!
  "All match results recorded in this competition."
  results: [Result!]!
}

# --- Entity stub: owned by the results subgraph ---

"Reference to a Result entity owned by the results subgraph."
type Result @key(fields: "id") {
  id: ID!
}

# --- Queries ---

type Query {
  "Fetch a single competition by its ID."
  competition(id: ID!): Competition
  """
  List competitions. Pass `enabled: true` to get only competitions that are
  opted in (results are being scraped); omit the argument to get all of them.
  """
  competitions(enabled: Boolean): [Competition!]!
}
