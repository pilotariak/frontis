name = "frontis-scheduler"
main = "src/index.ts"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 3 * * *"]

[dev]
inspector_port = 9233

[[d1_databases]]
binding = "DB_LEAGUE_LCAPB"
database_name = "pilotariak_lcapb"
database_id = "f2344757-9f73-4e16-bca9-554331062864"

[[d1_databases]]
binding = "DB_LEAGUE_LIDFPB"
database_name = "pilotariak_lidfpb"
database_id = "7672f60e-bd73-423e-ba92-d073c69d9c07"

[observability]
enabled = true
head_sampling_rate = 1
