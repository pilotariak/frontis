enum join__Graph {
  CATEGORIES @join__graph(name: "categories", url: "http://localhost:4006/graphql") 
  CLUBS @join__graph(name: "clubs", url: "http://localhost:4003/graphql") 
  COMPETITIONS @join__graph(name: "competitions", url: "http://localhost:4002/graphql") 
  ECHO @join__graph(name: "echo", url: "http://localhost:4001/graphql") 
  RANKINGS @join__graph(name: "rankings", url: "http://localhost:4007/graphql") 
  RESULTS @join__graph(name: "results", url: "http://localhost:4005/graphql") 
  SPECIALTIES @join__graph(name: "specialties", url: "http://localhost:4004/graphql") 
}

"""
A competition category (e.g. Seniors, Juniors, Vétérans).
"""
type Category @join__type(graph: CATEGORIES, key: "id")  @join__type(graph: RANKINGS, key: "id")  @join__type(graph: RESULTS, key: "id")  {
  id: ID!
  """
  Human-readable name of the category.
  """
  name: String! @join__field(graph: CATEGORIES) 
  """
  Whether this category is enabled (opt-in; defaults to false).
  """
  enabled: Boolean! @join__field(graph: CATEGORIES) 
  """
  Results played in this category, oldest first.
  """
  results(limit: Int = 100, offset: Int = 0) : [Result!]! @join__field(graph: RESULTS) 
}

type Query @join__type(graph: CATEGORIES)  @join__type(graph: CLUBS)  @join__type(graph: COMPETITIONS)  @join__type(graph: ECHO)  @join__type(graph: RANKINGS)  @join__type(graph: RESULTS)  @join__type(graph: SPECIALTIES)  {
  """
  Fetch a single category by its ID.
  """
  category(id: ID!) : Category @join__field(graph: CATEGORIES) 
  """
  List categories. Pass `enabled: true` to get only categories that are
  opted in; omit the argument to get all of them.
  """
  categories(enabled: Boolean) : [Category!]! @join__field(graph: CATEGORIES) 
  """
  Fetch a single club by its ID.
  """
  club(id: ID!) : Club @join__field(graph: CLUBS) 
  """
  List all clubs.
  """
  clubs: [Club!]! @join__field(graph: CLUBS) 
  """
  Fetch a single competition by its ID.
  """
  competition(id: ID!) : Competition @join__field(graph: COMPETITIONS) 
  """
  List competitions. Pass `enabled: true` to get only competitions that are
  opted in (results are being scraped); omit the argument to get all of them.
  """
  competitions(enabled: Boolean) : [Competition!]! @join__field(graph: COMPETITIONS) 
  """
  Echo back the provided message. Useful for liveness checks.
  """
  echo(message: String!) : String! @join__field(graph: ECHO) 
  """
  Return the current version of the Frontis project.
  """
  version: String! @join__field(graph: ECHO) 
  """
  Fetch a single team ranking by its ID.
  """
  teamRanking(id: ID!) : TeamRanking @join__field(graph: RANKINGS) 
  """
  The end-of-championship ranking of one competition, specialty and category,
  ordered by rank. Empty when the league site publishes none.
  """
  rankings(competitionId: ID!, specialtyId: ID!, categoryId: ID!) : [TeamRanking!]! @join__field(graph: RANKINGS) 
  """
  Every team ranking a player appears in, most recent season first. Give a
  `licence` (exact match), a `name`, or both. A name matches regardless of
  case, accents and word order, and every word given must appear in the
  player's name: "ane etxeberri" and "Etxeberri" both find "ETXEBERRI Ane".
  Words shorter than two characters are ignored. `limit` is clamped to 1..500.
  """
  playerRankings(
    licence: String
    name: String
    competitionId: ID
    specialtyId: ID
    categoryId: ID
    limit: Int = 100
    offset: Int = 0
  ): [TeamRanking!]! @join__field(graph: RANKINGS) 
  """
  Fetch a single result by its ID.
  """
  result(id: ID!) : Result @join__field(graph: RESULTS) 
  """
  List results with optional filters, ordered by id (insertion order).
  `limit` is clamped to 1..500.
  """
  results(
    competitionId: ID
    specialtyId: ID
    categoryId: ID
    clubId: ID
    phase: String
    limit: Int = 100
    offset: Int = 0
  ): [Result!]! @join__field(graph: RESULTS) 
  """
  A player by licence (exact match). Null when the licence appears in no result
  and no ranking of the league.
  """
  player(licence: String!) : Player @join__field(graph: RESULTS) 
  """
  Players whose name matches, in name order. A name matches regardless of case,
  accents and word order, and every word given must appear in the player's
  name: "ane etxeberri" and "Etxeberri" both find "ETXEBERRI Ane". Words
  shorter than two characters are ignored. Only players with results are
  found. `limit` is clamped to 1..500.
  """
  players(name: String!, limit: Int = 100, offset: Int = 0) : [Player!]! @join__field(graph: RESULTS) 
  """
  Fetch a single specialty by its ID.
  """
  specialty(id: ID!) : Specialty @join__field(graph: SPECIALTIES) 
  """
  List specialties. Pass `enabled: true` to get only specialties that are
  opted in; omit the argument to get all of them.
  """
  specialties(enabled: Boolean) : [Specialty!]! @join__field(graph: SPECIALTIES) 
}

"""
A pelota club (e.g. Denek Bat, Noizbait, Bixintxo).
"""
type Club @join__type(graph: CLUBS, key: "id")  @join__type(graph: RANKINGS, key: "id")  @join__type(graph: RESULTS, key: "id")  {
  id: ID!
  """
  Official club name.
  """
  name: String! @join__field(graph: CLUBS) 
  """
  Results where this club played as club A or club B, oldest first.
  """
  results(limit: Int = 100, offset: Int = 0) : [Result!]! @join__field(graph: RESULTS) 
}

"""
A competition (e.g. Championnat LCAPB 2025-2026).
"""
type Competition @join__type(graph: COMPETITIONS, key: "id")  @join__type(graph: RANKINGS, key: "id")  @join__type(graph: RESULTS, key: "id")  {
  id: ID!
  """
  External identifier used by the source league system.
  """
  source_id: String @join__field(graph: COMPETITIONS) 
  """
  Competition name.
  """
  name: String! @join__field(graph: COMPETITIONS) 
  """
  Whether this competition is enabled (opt-in; defaults to false).
  """
  enabled: Boolean! @join__field(graph: COMPETITIONS) 
  """
  All match results recorded in this competition.
  """
  results: [Result!]! @join__field(graph: COMPETITIONS) 
}

"""
Reference to a Result entity owned by the results subgraph.
"""
type Result @join__type(graph: COMPETITIONS, key: "id")  @join__type(graph: RESULTS, key: "id")  {
  id: ID!
  """
  Competition this result belongs to.
  """
  competition: Competition! @join__field(graph: RESULTS) 
  """
  Pelota discipline played.
  """
  specialty: Specialty! @join__field(graph: RESULTS) 
  """
  Age/skill category.
  """
  category: Category @join__field(graph: RESULTS) 
  """
  Date of the match as stored by the source league system (DD/MM/YYYY).
  """
  dateMatch: String @join__field(graph: RESULTS) 
  """
  Home club.
  """
  clubA: Club! @join__field(graph: RESULTS) 
  """
  Away club.
  """
  clubB: Club! @join__field(graph: RESULTS) 
  """
  Match scores as a space-separated list of sets (e.g. "15/10 15/13").
  """
  scores: String @join__field(graph: RESULTS) 
  """
  Per-set scores parsed from `scores`. Empty when `scores` is null or
  contains no well-formed `a/b` pair.
  """
  sets: [SetScore!]! @join__field(graph: RESULTS) 
  """
  Club that won the most sets. Null when there is no score, when the set
  count is tied, or when the match has not been played.
  """
  winner: Club @join__field(graph: RESULTS) 
  """
  Tournament phase (e.g. Finale, 1/2 Finale, Poule).
  """
  phase: String @join__field(graph: RESULTS) 
  """
  Players lineup for club A.
  """
  clubALineup: ClubLineup @join__field(graph: RESULTS) 
  """
  Players lineup for club B.
  """
  clubBLineup: ClubLineup @join__field(graph: RESULTS) 
}

"""
A player of a ranked team, as listed by the league site.
"""
type RankedPlayer @join__type(graph: RANKINGS)  {
  """
  Licence number, leading zeros kept (e.g. "000101"). Stable from one season to the next.
  """
  licence: String!
  """
  Player name as printed by the league site ("NAME Firstname"). Null when the site lists the licence alone.
  """
  name: String
}

"""
One team's line in the end-of-championship ranking ("Classement à la fin du
championnat") of a competition, specialty and category, as published by the
league site.
"""
type TeamRanking @join__type(graph: RANKINGS, key: "id")  {
  id: ID!
  """
  Competition (season) of the ranking.
  """
  competition: Competition!
  """
  Pelota discipline of the ranking.
  """
  specialty: Specialty!
  """
  Category (series or age group) of the ranking.
  """
  category: Category!
  """
  Club the team plays for.
  """
  club: Club!
  """
  Team number within the club (the site's "Equipe" column).
  """
  teamNumber: Int!
  """
  Final rank, 1 for the champion.
  """
  rank: Int!
  """
  Phase the team reached, as printed by the league site: Champion, Finale,
  1/2 finale, 1/4 de finale, Barrage, Poules, FORFAIT…
  """
  phase: String!
  """
  True once the ranking has a champion. False while the championship is still
  running: ranks and phases are then provisional.
  """
  final: Boolean!
  """
  Players of the team, in the league site's order (two or three).
  """
  players: [RankedPlayer!]!
}

"""
A player, identified by licence number. The results subgraph owns the player's
name and statistics; this subgraph adds the rankings.
"""
type Player @join__type(graph: RANKINGS, key: "licence")  @join__type(graph: RESULTS, key: "licence")  {
  """
  Licence number, leading zeros kept (e.g. "059063").
  """
  licence: String!
  """
  Every team ranking the player appears in, most recent season first, as
  `playerRankings(licence: …)` returns them. `limit` is clamped to 1..500.
  """
  rankings(
    competitionId: ID
    specialtyId: ID
    categoryId: ID
    limit: Int = 100
    offset: Int = 0
  ): [TeamRanking!]! @join__field(graph: RANKINGS) 
  """
  Name as printed in the player's results, marker stripped. Falls back to the
  latest ranking for a player without results.
  """
  name: String @join__field(graph: RESULTS) 
  """
  Match statistics, optionally restricted to a competition, a specialty and a
  category.
  """
  stats(competitionId: ID, specialtyId: ID, categoryId: ID) : PlayerStats! @join__field(graph: RESULTS) 
  """
  Players met on the same side, most matches first.
  """
  partners(competitionId: ID, specialtyId: ID, categoryId: ID) : [PlayerMatchup!]! @join__field(graph: RESULTS) 
  """
  Players met on the other side, most matches first.
  """
  opponents(competitionId: ID, specialtyId: ID, categoryId: ID) : [PlayerMatchup!]! @join__field(graph: RESULTS) 
  """
  The player's matches, most recent first. `limit` is clamped to 1..500.
  """
  results(
    competitionId: ID
    specialtyId: ID
    categoryId: ID
    limit: Int = 100
    offset: Int = 0
  ): [Result!]! @join__field(graph: RESULTS) 
}

"""
Reference to a Specialty entity owned by the specialties subgraph.
"""
type Specialty @join__type(graph: RANKINGS, key: "id")  @join__type(graph: RESULTS, key: "id")  @join__type(graph: SPECIALTIES, key: "id")  {
  id: ID!
  """
  Results played in this discipline, oldest first.
  """
  results(limit: Int = 100, offset: Int = 0) : [Result!]! @join__field(graph: RESULTS) 
  """
  Human-readable name of the discipline.
  """
  name: String! @join__field(graph: SPECIALTIES) 
  """
  Whether this specialty is enabled (opt-in; defaults to false).
  """
  enabled: Boolean! @join__field(graph: SPECIALTIES) 
}

"""
A player of a match lineup, as the league site prints it.
"""
type LineupPlayer @join__type(graph: RESULTS)  {
  """
  Player name as printed by the league site, marker included ("PRADERE Bastien (S)").
  """
  name: String!
  """
  Licence number, optionally followed by the licence club ("097866 - 01-641-015").
  """
  number: String
  """
  The player, for their statistics. Null when the lineup gives no licence.
  """
  player: Player
}

"""
The two players representing a club in a match.
"""
type ClubLineup @join__type(graph: RESULTS)  {
  """
  First player.
  """
  player1: LineupPlayer
  """
  Second player (doubles).
  """
  player2: LineupPlayer
}

"""
Match statistics of a player. A match with no score, or with as many sets won
by each side, counts as played but neither won nor lost.
"""
type PlayerStats @join__type(graph: RESULTS)  {
  """
  Matches played.
  """
  played: Int!
  """
  Matches won.
  """
  won: Int!
  """
  Matches lost.
  """
  lost: Int!
  """
  Sets won, over every match.
  """
  setsWon: Int!
  """
  Sets lost, over every match.
  """
  setsLost: Int!
  """
  Points scored by the player's side, over every set.
  """
  pointsFor: Int!
  """
  Points scored by the other side, over every set.
  """
  pointsAgainst: Int!
  """
  The same statistics for each competition, specialty and category the player
  has matches in, most recent season first.
  """
  breakdown: [PlayerStatsLine!]!
}

"""
Match statistics of a player in one competition, specialty and category.
"""
type PlayerStatsLine @join__type(graph: RESULTS)  {
  competition: Competition!
  specialty: Specialty!
  category: Category
  played: Int!
  won: Int!
  lost: Int!
  setsWon: Int!
  setsLost: Int!
  pointsFor: Int!
  pointsAgainst: Int!
}

"""
Another player and the matches shared with them, as partner or as opponent.
`won` and `lost` are those of the player queried.
"""
type PlayerMatchup @join__type(graph: RESULTS)  {
  player: Player!
  """
  Matches played with (partners) or against (opponents) this player.
  """
  played: Int!
  won: Int!
  lost: Int!
}

"""
The score of a single set, as parsed from the raw `scores` string.
"""
type SetScore @join__type(graph: RESULTS)  {
  """
  Points scored by club A in this set.
  """
  a: Int!
  """
  Points scored by club B in this set.
  """
  b: Int!
}
    