enum join__Graph {
  CLUBS @join__graph(name: "clubs", url: "http://localhost:4003/graphql")
  COMPETITIONS @join__graph(name: "competitions", url: "http://localhost:4002/graphql")
  ECHO @join__graph(name: "echo", url: "http://localhost:4001/graphql")
  RESULTS @join__graph(name: "results", url: "http://localhost:4005/graphql")
  SPECIALTIES @join__graph(name: "specialties", url: "http://localhost:4004/graphql")
}

"""
A pelota club (e.g. Denek Bat, Noizbait, Bixintxo).
"""
type Club @join__type(graph: CLUBS, key: "id")  @join__type(graph: RESULTS, key: "id")  {
  id: ID!
  """
  Official club name.
  """
  name: String! @join__field(graph: CLUBS)
}

type Query @join__type(graph: CLUBS)  @join__type(graph: COMPETITIONS)  @join__type(graph: ECHO)  @join__type(graph: RESULTS)  @join__type(graph: SPECIALTIES)  {
  """
  Fetch a single club by its ID.
  """
  club(id: ID!) : Club @join__field(graph: CLUBS)
  """
  List all clubs.
  """
  clubs: [Club!]! @join__field(graph: CLUBS)
  """
  Fetch a single competition by its ID.
  """
  competition(id: ID!) : Competition @join__field(graph: COMPETITIONS)
  """
  List all competitions.
  """
  competitions: [Competition!]! @join__field(graph: COMPETITIONS)
  """
  Echo back the provided message. Useful for liveness checks.
  """
  echo(message: String!) : String! @join__field(graph: ECHO)
  """
  Return the current version of the Frontis project.
  """
  version: String! @join__field(graph: ECHO)
  """
  Fetch a single result by its ID.
  """
  result(id: ID!) : Result @join__field(graph: RESULTS)
  """
  List results with optional filters.
  """
  results(competitionId: ID, specialtyId: ID, category: String, phase: String) : [Result!]! @join__field(graph: RESULTS)
  """
  Fetch a single specialty by its ID.
  """
  specialty(id: ID!) : Specialty @join__field(graph: SPECIALTIES)
  """
  List all specialties.
  """
  specialties: [Specialty!]! @join__field(graph: SPECIALTIES)
}

"""
A competition (e.g. Championnat LCAPB 2025-2026).
"""
type Competition @join__type(graph: COMPETITIONS, key: "id")  @join__type(graph: RESULTS, key: "id")  {
  id: ID!
  """
  External identifier used by the source league system.
  """
  source_id: String @join__field(graph: COMPETITIONS)
  """
  Competition name.
  """
  name: String! @join__field(graph: COMPETITIONS)
  """
  All match results recorded in this competition.
  """
  results: [Result!]! @join__field(graph: COMPETITIONS)
}

"""
Reference to a Result entity owned by the results subgraph.
"""
type Result @join__type(graph: COMPETITIONS, key: "id")  @join__type(graph: RESULTS, key: "id")  {
  id: ID!
  """
  Competition this result belongs to.
  """
  competition: Competition! @join__field(graph: RESULTS)
  """
  Pelota discipline played.
  """
  specialty: Specialty! @join__field(graph: RESULTS)
  """
  Age/skill category (e.g. Seniors Grande Semaine, Cadets).
  """
  category: String @join__field(graph: RESULTS)
  """
  Date of the match (ISO 8601).
  """
  dateMatch: String @join__field(graph: RESULTS)
  """
  Home club.
  """
  clubA: Club! @join__field(graph: RESULTS)
  """
  Away club.
  """
  clubB: Club! @join__field(graph: RESULTS)
  """
  Score of club A.
  """
  scoreA: Int @join__field(graph: RESULTS)
  """
  Score of club B.
  """
  scoreB: Int @join__field(graph: RESULTS)
  """
  Tournament phase (e.g. Finale, 1/2 Finale, Poule).
  """
  phase: String @join__field(graph: RESULTS)
  """
  Players lineup for club A.
  """
  clubALineup: ClubLineup @join__field(graph: RESULTS)
  """
  Players lineup for club B.
  """
  clubBLineup: ClubLineup @join__field(graph: RESULTS)
}

"""
A player participating in a match (from the results table).
"""
type Player @join__type(graph: RESULTS)  {
  """
  Player display name.
  """
  name: String!
  """
  Jersey number or licence number.
  """
  number: String
}

"""
The two players representing a club in a match.
"""
type ClubLineup @join__type(graph: RESULTS)  {
  """
  First player.
  """
  player1: Player
  """
  Second player (doubles).
  """
  player2: Player
}

"""
Reference to a Specialty entity owned by the specialties subgraph.
"""
type Specialty @join__type(graph: RESULTS, key: "id")  @join__type(graph: SPECIALTIES, key: "id")  {
  id: ID!
  """
  Human-readable name of the discipline.
  """
  name: String! @join__field(graph: SPECIALTIES)
}
