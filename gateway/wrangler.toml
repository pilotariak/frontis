name = "frontis-gateway"
main = "index.ts"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/*.graphql", "**/*.html"]
fallthrough = false

[dev]
inspector_port = 9232

[observability]
enabled = true
head_sampling_rate = 1

[[services]]
binding = "ECHO"
service = "frontis-echo"

[[services]]
binding = "SPECIALTIES"
service = "frontis-specialties"

[[services]]
binding = "CLUBS"
service = "frontis-clubs"

[[services]]
binding = "COMPETITIONS"
service = "frontis-competitions"

[[services]]
binding = "CATEGORIES"
service = "frontis-categories"

[[services]]
binding = "RESULTS"
service = "frontis-results"

[[services]]
binding = "RANKINGS"
service = "frontis-rankings"

[vars]
ENVIRONMENT = "dev"
LOG_LEVEL = "debug"
GRAPHQL_MAX_DEPTH = "7"
GRAPHQL_MAX_TOKENS = "1000"
GRAPHQL_MAX_DIRECTIVES = "10"
# Demand control: max query cost (sum of per-field weights); 0 = disabled
GRAPHQL_MAX_COST = "1000"

# Rate limiting: Workers Rate Limiting bindings, requests per client IP and
# root Query field, counted per Cloudflare location. `period` must be 10 or 60
# (gateway/rate-limit.ts assumes 60 for Retry-After). `namespace_id` must be
# unique in the Cloudflare account: azkena uses 1001-1003. Bindings are not
# inherited by [env.production], so they are declared again below.
[[ratelimits]]
name = "RATE_LIMIT_LIST"
namespace_id = "1101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_ITEM"
namespace_id = "1102"
simple = { limit = 120, period = 60 }

[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "warn"
GRAPHQL_MAX_DEPTH = "7"
GRAPHQL_MAX_TOKENS = "1000"
GRAPHQL_MAX_DIRECTIVES = "10"
GRAPHQL_MAX_COST = "1000"

[[env.production.ratelimits]]
name = "RATE_LIMIT_LIST"
namespace_id = "1103"
simple = { limit = 60, period = 60 }

[[env.production.ratelimits]]
name = "RATE_LIMIT_ITEM"
namespace_id = "1104"
simple = { limit = 120, period = 60 }
