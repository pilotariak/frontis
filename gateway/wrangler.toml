name = "frontis-gateway"
main = "index.ts"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/*.graphql", "**/*.html"]
fallthrough = false

[dev]
inspector_port = 9232

[observability]
enabled = true
head_sampling_rate = 1

[[services]]
binding = "ECHO"
service = "frontis-echo"

[[services]]
binding = "SPECIALTIES"
service = "frontis-specialties"

[[services]]
binding = "CLUBS"
service = "frontis-clubs"

[[services]]
binding = "COMPETITIONS"
service = "frontis-competitions"

[[services]]
binding = "RESULTS"
service = "frontis-results"

[vars]
ENVIRONMENT = "dev"

[env.production.vars]
ENVIRONMENT = "production"
